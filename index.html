<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>솔비 메모</title>
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="솔비">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.svg">
<link rel="apple-touch-icon" href="./icon-192.svg">
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--mut:#64748b;--bd:#e2e8f0;--blue:#3b82f6;--sky:#0ea5e9;--ok:#10b981;--err:#ef4444;--rec:#ef4444}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,'Pretendard','Segoe UI',sans-serif;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
.hd h1{margin:0;font-size:15px}
.ver{font-size:10px;color:var(--mut);background:#f1f5f9;padding:2px 7px;border-radius:999px}
.hd .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.star{font-size:20px;cursor:pointer;background:transparent;border:none;padding:4px 8px;line-height:1}
.body{flex:1;padding:12px;overflow:auto;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:13px;margin-bottom:10px}
textarea#memoText{width:100%;min-height:160px;border:1px solid var(--bd);border-radius:9px;padding:11px;font:16px/1.5 inherit;resize:vertical;background:#fff}
textarea#memoText:focus{outline:2px solid var(--blue);outline-offset:-1px}
.rec-bar{display:none;align-items:center;gap:9px;padding:9px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:9px;color:#991b1b;font-size:13px;margin-top:8px}
.rec-bar.on{display:flex}
.rec-dot{width:9px;height:9px;background:var(--rec);border-radius:50%;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.transcript{background:#f8fafc;border:1px dashed var(--bd);border-radius:8px;padding:9px;font-size:13px;color:var(--mut);min-height:38px;white-space:pre-wrap;margin-top:8px;display:none}
.transcript.on{display:block}
.acts{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(248,250,252,.96);backdrop-filter:blur(10px);border-top:1px solid var(--bd);display:flex;gap:8px;z-index:20}
.btn{appearance:none;border:1px solid var(--bd);background:#fff;color:var(--ink);padding:13px 14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:48px}
.btn:active{background:#f1f5f9}
.btn:disabled{opacity:.5}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue);flex:1}
.btn.rec{background:var(--rec);color:#fff;border-color:var(--rec)}
.list{display:flex;flex-direction:column;gap:6px}
.list .it{padding:9px 11px;background:#fff;border:1px solid var(--bd);border-radius:8px;font-size:13px;display:flex;gap:8px;align-items:center}
.list .it.opt{background:#fff7ed;border-color:#fed7aa}
.list .it.del{opacity:.3}
.list .it .t{color:var(--mut);font-size:11px;min-width:84px}
.list .it .p{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .a{color:var(--rec)}
.list .it .x{appearance:none;border:none;background:transparent;color:var(--mut);font-size:16px;cursor:pointer;padding:4px 8px;min-width:36px;min-height:36px;border-radius:6px}
.list .it .x:active{background:#fee2e2;color:var(--err)}
.empty{color:var(--mut);text-align:center;padding:18px;font-size:13px}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;z-index:30;max-width:90%}
.toast.on{opacity:.95}
.hint{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;padding:9px 12px;border-radius:9px;font-size:12px;margin-bottom:10px}
.hint code{background:#dbeafe;padding:1px 5px;border-radius:4px;font-size:11px}
/* setup overlay */
.setup{position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
.setup.on{display:flex}
.setup .box{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.setup h3{margin:0 0 8px;font-size:16px}
.setup p{margin:0 0 12px;color:var(--mut);font-size:13px;line-height:1.55}
.setup input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:9px;font:14px/1 inherit;margin-bottom:10px}
.foot{text-align:right;font-size:10px;color:var(--mut);padding:6px 14px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:13px;max-width:480px;width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto 0}
.modal .hd2{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#fff;border-radius:13px 13px 0 0;z-index:2}
.modal .bd{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.modal h3{margin:0;font-size:15px}
.modal .bd{padding:14px 16px;font-size:14px;line-height:1.6}
.modal .ft{padding:0 16px 14px;display:flex;gap:8px;justify-content:flex-end}
.tabs{display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--bd);padding:6px 10px;position:sticky;top:48px;z-index:9}
.tab{flex:1;padding:8px 6px;text-align:center;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut);background:transparent;border:none}
.tab.on{background:var(--blue);color:#fff}
.pane{display:none}
.pane.on{display:block}
.issue-card{padding:11px 13px;background:#fff;border:1px solid var(--bd);border-radius:9px;margin-bottom:8px;cursor:pointer}
.issue-card:active{background:#f8fafc}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;margin-right:6px}
.b-미해결{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.b-진행중{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.b-해결{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.b-보류{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1}
.b-cat{background:#f1f5f9;color:#475569;font-weight:500}
</style>
</head>
<body>

<div class="hd">
  <h1>📝 솔비 메모</h1>
  <span class="ver" id="ver">v2.2.0</span>
  <div class="right">
    <button class="star" onclick="copyContext()" title="새 Claude 세션 컨텍스트 복사" style="font-size:16px">🔗</button>
    <button class="star" id="installBtn" title="앱 설치" style="display:none">⭐</button>
  </div>
</div>

<div class="tabs">
  <button class="tab on" data-pane="paneMemo" onclick="pwaTab(this)">📝 메모</button>
  <button class="tab" data-pane="paneDaily" onclick="pwaTab(this)">📅 일일</button>
  <button class="tab" data-pane="paneReport" onclick="pwaTab(this)">📑 보고서</button>
  <button class="tab" onclick="openGuides()" style="flex:0 0 auto;padding:8px 10px">📜</button>
</div>

<div class="body">
  <div class="pane on" id="paneMemo">
    <div class="hint">💡 정리는 Claude Code에서 <code>/메모정리</code></div>
    <div class="card">
      <textarea id="memoText" placeholder="아이디어·일정·기억할 것·특이사항 — 두서없이 던지세요."></textarea>
      <div class="rec-bar" id="recBar"><span class="rec-dot"></span><span>녹음 중 — <span id="recTime">00:00</span></span></div>
      <div class="transcript" id="transcript"></div>
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        <button class="btn" onclick="captureLoc()" id="locBtn" style="padding:7px 11px;font-size:13px">📍 위치</button>
        <label class="btn" style="padding:7px 11px;font-size:13px;cursor:pointer">📎 사진
          <input id="imgInput" type="file" accept="image/*" multiple onchange="onImgPick(event)" style="display:none">
        </label>
        <label class="btn" style="padding:7px 11px;font-size:13px;cursor:pointer">📄 파일
          <input id="fileInput" type="file" multiple onchange="onFilePick(event)" style="display:none">
        </label>
        <button class="btn" onclick="clearAttach()" id="clearAttachBtn" style="padding:7px 11px;font-size:13px;display:none">✕ 첨부 해제</button>
      </div>
      <div id="locInfo" style="display:none;margin-top:8px;padding:7px 10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;color:#1e3a8a;font-size:12px"></div>
      <div id="imgPreview" style="display:none;margin-top:8px;gap:6px;flex-wrap:wrap"></div>
      <div id="filePreview" style="display:none;margin-top:8px;flex-direction:column;gap:4px"></div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b>대기 큐</b><span id="memoCount" style="margin-left:auto;color:var(--mut);font-size:12px">-</span></div>
      <div class="list" id="memoList"><div class="empty">불러오는 중…</div></div>
    </div>
  </div>

  <div class="pane" id="paneDaily">
    <div class="card">
      <div style="display:flex;gap:4px;margin-bottom:8px">
        <button class="btn" id="dTabIssue" onclick="dSwitch('issue')" style="flex:1;padding:9px;font-size:13px;background:var(--blue);color:#fff;border-color:var(--blue)">📋 이슈</button>
        <button class="btn" id="dTabPerson" onclick="dSwitch('person')" style="flex:1;padding:9px;font-size:13px">👥 인원</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px"><b id="dTitle">📋 일일 이슈</b><span id="dCount" style="margin-left:auto;color:var(--mut);font-size:12px">-</span></div>
      <div style="color:var(--mut);font-size:12px;margin-top:4px" id="dHint">오늘이 항상 맨 위. 매일 06:00 자동 생성 + 첫 응답 시 보강.</div>
    </div>
    <div id="dList" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><div class="empty">불러오는 중…</div></div>
  </div>

  <div class="pane" id="paneReport">
    <div class="card">
      <div style="display:flex;gap:4px;margin-bottom:8px">
        <button class="btn" id="rTabReport" onclick="rSwitch('report')" style="flex:1;padding:9px;font-size:13px;background:var(--blue);color:#fff;border-color:var(--blue)">📊 조사보고서</button>
        <button class="btn" id="rTabIssue" onclick="rSwitch('issue')" style="flex:1;padding:9px;font-size:13px">🐛 이슈</button>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <input id="rSearch" placeholder="검색" oninput="renderReports()" style="flex:1;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;font:14px inherit">
        <select id="rFilter" onchange="renderReports()" style="padding:8px;border:1px solid var(--bd);border-radius:8px;font:13px inherit;background:#fff">
          <option value="">전체상태</option>
          <option value="open">활성</option>
          <option value="미해결">미해결</option>
          <option value="진행중">진행중</option>
          <option value="해결">해결</option>
          <option value="보류">보류</option>
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:8px"><b id="rTitle">조사보고서</b><span id="rCount" style="margin-left:auto;color:var(--mut);font-size:12px">-</span></div>
    </div>
    <div id="rList"><div class="empty">불러오는 중…</div></div>
  </div>
</div>

<div class="acts" id="memoActs">
  <button class="btn rec" id="recBtn" onclick="toggleRec()" style="flex:0 0 auto">🎙</button>
  <button class="btn" id="longRecBtn" onclick="toggleLongRec()" style="flex:0 0 auto;background:#7c3aed;color:#fff;border-color:#7c3aed" title="장기 녹음 (1시간씩 자동 저장)">🔴∞</button>
  <button class="btn pri" id="saveBtn" onclick="saveMemo()">💾 저장</button>
</div>

<div class="foot">CDN &amp; Cloud is by Solbox..</div>

<!-- Setup -->
<div class="setup" id="setup">
  <div class="box">
    <h3>🔑 최초 설정</h3>
    <p>솔비 백엔드에 연결하려면 <b>API URL + 토큰</b>이 필요해요.<br>솔비 대시보드에서 <b>PWA 설정</b> 버튼을 누르면 자동 생성됩니다.</p>
    <input id="setupUrl" placeholder="API URL (https://script.google.com/...)" />
    <input id="setupToken" placeholder="토큰 (32자)" />
    <button class="btn pri" onclick="saveSetup()" style="width:100%">저장 후 시작</button>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal" id="modal">
  <div class="box">
    <div class="hd2"><h3 id="mt">제목</h3><button class="btn" onclick="closeModal()" style="margin-left:auto;padding:4px 10px;min-height:auto">✕</button></div>
    <div class="bd" id="mb"></div>
    <div class="ft"><button class="btn" onclick="closeModal()">취소</button><button class="btn pri" id="mOk" style="flex:0">확인</button></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let API_URL = localStorage.getItem('sobi_api') || '';
let API_TOKEN = localStorage.getItem('sobi_token') || '';

// URL 해시에서 setup 정보 받기: #setup=BASE64(encodeURIComponent(JSON))
(function(){
  const hash = location.hash;
  if (hash.startsWith('#setup=')) {
    try {
      // 대시보드 인코딩: btoa(encodeURIComponent(JSON.stringify({url,token})))
      // 역순: JSON.parse(decodeURIComponent(atob(...)))
      const d = JSON.parse(decodeURIComponent(atob(hash.slice(7))));
      if (validUrl(d.url) && validToken(d.token)) {
        localStorage.setItem('sobi_api', d.url);
        localStorage.setItem('sobi_token', d.token);
        API_URL = d.url; API_TOKEN = d.token;
        history.replaceState(null,'',location.pathname);
      } else {
        toast('셋업 링크 형식 오류');
      }
    } catch(e){ toast('셋업 디코딩 실패: '+e.message); }
  }
})();

function validUrl(u){ return typeof u==='string' && /^https:\/\/script\.google\.com\/.+\/exec$/.test(u); }
function validToken(t){ return typeof t==='string' && /^[0-9a-f]{32}$/i.test(t); }

if (!API_URL || !API_TOKEN || !validUrl(API_URL) || !validToken(API_TOKEN)) {
  // 잘못된 값 있으면 비우고 setup 다시 띄움
  if (API_URL && !validUrl(API_URL)) localStorage.removeItem('sobi_api');
  if (API_TOKEN && !validToken(API_TOKEN)) localStorage.removeItem('sobi_token');
  API_URL=''; API_TOKEN='';
  document.getElementById('setup').classList.add('on');
}
async function saveSetup(){
  const u = document.getElementById('setupUrl').value.trim();
  const t = document.getElementById('setupToken').value.trim();
  if (!validUrl(u)) { toast('URL 형식 오류 (script.google.com/.../exec)'); return; }
  if (!validToken(t)) { toast('토큰 32자 hex 형식 아님'); return; }
  // ping 으로 즉시 검증
  toast('연결 테스트 중…');
  try {
    const resp = await fetch(u + '?api=ping&token=' + encodeURIComponent(t));
    const j = await resp.json();
    if (j.error) { toast('인증 실패: '+j.error); return; }
  } catch(e) { toast('연결 실패: '+e.message); return; }
  localStorage.setItem('sobi_api', u); localStorage.setItem('sobi_token', t);
  API_URL=u; API_TOKEN=t;
  document.getElementById('setup').classList.remove('on');
  toast('✅ 연결됨'); refreshMemos();
}
function resetSetup(){
  localStorage.removeItem('sobi_api'); localStorage.removeItem('sobi_token');
  location.reload();
}

// 설치 버튼
let deferred = null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferred = e;
  document.getElementById('installBtn').style.display = '';
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if (!deferred) { toast('이미 설치되었거나 지원되지 않음'); return; }
  deferred.prompt();
  await deferred.userChoice;
  deferred = null;
  document.getElementById('installBtn').style.display = 'none';
});

// SW 등록
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

// 공용 API 호출
// /exec 가 POST → 302 → GET 으로 변환되면 body 가 사라지므로
// 인증·액션은 URL 쿼리에도 함께 실어 fallback 안전망 확보
async function callApi(action, data){
  if (!API_URL || !API_TOKEN) throw new Error('not_setup');
  const body = Object.assign({ api: action, token: API_TOKEN }, data || {});
  const qs = '?api=' + encodeURIComponent(action) + '&token=' + encodeURIComponent(API_TOKEN);
  const url = API_URL + qs;
  // 작은 페이로드는 GET 만으로 끝(리다이렉트 영향 0)
  const READ_GET = ['ping','listMemos','deleteMemo','getProgress','getRecentActivity','listPersonal','listIssues','getIssue'];
  const small = !data || !data.audioBase64;
  if (small && READ_GET.indexOf(action) >= 0) {
    let g = url;
    if (data && data.id) g += '&id=' + encodeURIComponent(data.id);
    if (data && data.limit) g += '&limit=' + data.limit;
    const r = await fetch(g);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return j;
  }
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    mode: 'cors'
  });
  const json = await resp.json();
  if (json.error) throw new Error(json.error);
  return json;
}

// 토스트
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),1800); }

// 모달
function showConfirm(title, msg, onOk){
  document.getElementById('mt').textContent = title;
  document.getElementById('mb').innerHTML = esc(msg);
  document.getElementById('modal').classList.add('on');
  document.getElementById('mOk').onclick = ()=>{ closeModal(); onOk && onOk(); };
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 녹음 + STT
let mediaRec=null, mediaChunks=[], recStart=0, recTimer=null, audioBlob=null, audioMime='audio/webm';
let speechRec=null, transcriptBuf='', speechActive=false;
function toggleRec(){ if (mediaRec && mediaRec.state==='recording') stopRec(); else startRec(); }
async function startRec(){
  if (!navigator.mediaDevices) { toast('녹음 미지원'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    audioMime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
    mediaRec = new MediaRecorder(stream, { mimeType: audioMime });
    mediaChunks=[]; audioBlob=null;
    mediaRec.ondataavailable = e => { if (e.data && e.data.size > 0) mediaChunks.push(e.data); };
    mediaRec.onstop = ()=>{
      audioBlob = new Blob(mediaChunks, { type: audioMime });
      stream.getTracks().forEach(t=>t.stop());
      document.getElementById('recBar').classList.remove('on');
      document.getElementById('recBtn').textContent='🎙';
      clearInterval(recTimer); stopSpeech();
      toast('녹음 완료');
    };
    mediaRec.start(); recStart = Date.now();
    document.getElementById('recBar').classList.add('on');
    document.getElementById('recBtn').textContent='⏹';
    recTimer = setInterval(()=>{
      const s = Math.floor((Date.now()-recStart)/1000);
      document.getElementById('recTime').textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    }, 500);
    startSpeech();
  } catch (e) { toast('마이크 권한 필요'); }
}
function stopRec(){ if (mediaRec) mediaRec.stop(); }
function startSpeech(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  speechRec = new SR();
  speechRec.continuous = true; speechRec.interimResults = true; speechRec.lang = 'ko-KR';

// ===== 장기 녹음 (1시간씩 자동 저장 + wake-lock) =====
// ⚠️ 모바일 OS 정책상 화면이 꺼지면 마이크 차단. wake-lock으로 화면 유지.
// 폰을 충전기 꽂아둔 상태 + 앱 화면 켜진 상태에서 무제한 녹음 + 1시간마다 자동 저장.
let longRecActive = false, longRecStream = null, longRecRec = null, longRecChunks = [];
let longRecStart = 0, longRecRotateTimer = null, wakeLock = null;
const LONG_REC_ROTATE_MS = 60 * 60 * 1000; // 1시간
async function toggleLongRec(){
  if (longRecActive) await stopLongRec();
  else await startLongRec();
}
async function startLongRec(){
  if (!navigator.mediaDevices) { toast('녹음 미지원'); return; }
  try {
    longRecStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    // wake-lock — 화면 꺼지지 않게
    if ('wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
    }
    longRecActive = true;
    longRecStart = Date.now();
    startNewLongChunk();
    // 1시간마다 자동 회전 (저장 + 새 녹음)
    longRecRotateTimer = setInterval(rotateLongChunk, LONG_REC_ROTATE_MS);
    document.getElementById('longRecBtn').textContent = '⏹ 장기녹음 중';
    document.getElementById('longRecBtn').style.background = '#dc2626';
    toast('🔴 장기 녹음 시작 — 1시간마다 자동 저장 (화면 켜두세요)');
  } catch (e) { toast('마이크/wake-lock 실패: '+e.message); }
}
function startNewLongChunk(){
  if (!longRecStream) return;
  longRecChunks = [];
  const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
  longRecRec = new MediaRecorder(longRecStream, { mimeType: mime });
  longRecRec.ondataavailable = e => { if (e.data && e.data.size > 0) longRecChunks.push(e.data); };
  longRecRec.onstop = async () => {
    if (!longRecChunks.length) return;
    const blob = new Blob(longRecChunks, { type: longRecRec.mimeType });
    const dur = Math.floor((Date.now()-longRecStart)/1000);
    const startedAt = new Date(longRecStart).toISOString();
    // 메모 생성 + 오디오 청크 업로드
    try {
      const meta = await callApi('saveMemo', { text:'[🔴 장기녹음] '+new Date(longRecStart).toLocaleString('ko-KR')+' ~ '+dur+'초', transcript:'', source:'voice', durationSec:dur });
      const b64 = await blobToBase64(blob);
      await uploadAudioChunks(meta.id, b64, longRecRec.mimeType);
      toast('💾 1시간 청크 저장됨');
    } catch(e){ toast('청크 저장 실패: '+e.message); }
  };
  longRecRec.start(5000); // 5초마다 chunk 모음
  longRecStart = Date.now();
}
async function rotateLongChunk(){
  if (!longRecRec) return;
  longRecRec.stop();
  // stop은 비동기로 onstop 실행 — 잠시 대기 후 새 녹음
  setTimeout(startNewLongChunk, 500);
}
async function stopLongRec(){
  longRecActive = false;
  clearInterval(longRecRotateTimer); longRecRotateTimer = null;
  if (longRecRec && longRecRec.state==='recording') longRecRec.stop();
  if (longRecStream) longRecStream.getTracks().forEach(t=>t.stop());
  if (wakeLock) { try { await wakeLock.release(); } catch(_){}; wakeLock = null; }
  document.getElementById('longRecBtn').textContent = '🔴∞';
  document.getElementById('longRecBtn').style.background = '#7c3aed';
  toast('⏹ 장기 녹음 종료');
}

// 공통 청크 업로더 — 100KB 청크, 5개 병렬, 3회 재시도, 진행률 toast
// kind: 'audio'|'image'|'file'
async function uploadChunks(kind, memoId, b64, opts){
  const CHUNK = 100000; // 100KB (Drive 임시 파일 방식이라 한도 큼)
  const PARALLEL = 5;
  const RETRIES = 3;
  const label = kind==='audio' ? '🎙' : kind==='image' ? '📎' : '📄';
  const init = await callApi(kind+'Init', {});
  const sid = init.sid;
  const total = Math.ceil(b64.length / CHUNK);
  let done = 0;
  const tasks = [];
  for (let i = 0; i < total; i++) {
    const seq = i;
    const part = b64.slice(seq*CHUNK, (seq+1)*CHUNK);
    tasks.push({ seq, part });
  }
  // 진행률 toast (10%마다)
  let lastPct = -1;
  const updatePct = () => {
    const pct = Math.floor(done/total*100);
    if (pct !== lastPct && (pct - lastPct >= 10 || pct === 100)) {
      lastPct = pct; toast(label+' '+pct+'% ('+done+'/'+total+')');
    }
  };
  // 병렬 워커
  let cursor = 0;
  async function worker(){
    while (cursor < tasks.length) {
      const t = tasks[cursor++];
      let attempt = 0, ok = false;
      while (attempt < RETRIES && !ok) {
        try {
          const r = await callApi(kind+'Chunk', { sid, seq:t.seq, data:t.part });
          if (r.error) throw new Error(r.error);
          ok = true;
        } catch(e) {
          attempt++;
          if (attempt >= RETRIES) throw new Error('chunk '+t.seq+' 최종실패: '+e.message);
          await new Promise(r=>setTimeout(r, 500*Math.pow(3,attempt-1))); // 500ms,1.5s,4.5s
        }
      }
      done++; updatePct();
    }
  }
  const workers = [];
  for (let w = 0; w < Math.min(PARALLEL, total); w++) workers.push(worker());
  await Promise.all(workers);
  const finalParams = Object.assign({ sid, memoId }, opts||{});
  const fin = await callApi(kind+'Final', finalParams);
  if (fin.error) {
    if (fin.error === 'missing_chunks' && fin.missing && fin.missing.length) {
      // 누락 청크 자동 재전송
      toast('🔁 누락 청크 '+fin.missing.length+'개 재전송 중…');
      for (const seq of fin.missing) {
        const part = b64.slice(seq*CHUNK, (seq+1)*CHUNK);
        await callApi(kind+'Chunk', { sid, seq, data: part });
      }
      const fin2 = await callApi(kind+'Final', finalParams);
      if (fin2.error) throw new Error('final 재시도 실패: '+fin2.error);
      return fin2;
    }
    throw new Error('final: '+fin.error);
  }
  return fin;
}
async function uploadAudioChunks(memoId, b64, mime){ return uploadChunks('audio', memoId, b64, { mime }); }
async function uploadImageChunks(memoId, blob, mime){
  const b64 = await blobToBase64(blob);
  return uploadChunks('image', memoId, b64, { mime });

async function uploadFileChunks(memoId, blob, mime, name){

let reportCache = [];
let rMode = 'report'; // 'report' = 조사보고서, 'issue' = 이슈
function rSwitch(mode){
  rMode = mode;
  document.getElementById('rTabReport').style.background = mode==='report' ? 'var(--blue)' : '#fff';
  document.getElementById('rTabReport').style.color = mode==='report' ? '#fff' : 'var(--ink)';
  document.getElementById('rTabReport').style.borderColor = mode==='report' ? 'var(--blue)' : 'var(--bd)';
  document.getElementById('rTabIssue').style.background = mode==='issue' ? 'var(--blue)' : '#fff';
  document.getElementById('rTabIssue').style.color = mode==='issue' ? '#fff' : 'var(--ink)';
  document.getElementById('rTabIssue').style.borderColor = mode==='issue' ? 'var(--blue)' : 'var(--bd)';
  document.getElementById('rTitle').textContent = mode==='report' ? '조사보고서' : '이슈';
  // 모드 바뀌면 활성 필터를 조사보고서일 땐 전체, 이슈일 땐 활성 디폴트
  document.getElementById('rFilter').value = mode==='report' ? '' : 'open';
  renderReports();
}
// 간단 마크다운 → HTML (이미지·링크·굵게·코드·헤더·줄바꿈)
function md2html(s){
  if (!s) return '';
  let h = esc(s);
  // ![alt](url) — 이미지
  h = h.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, (_,a,u)=>'<img src="'+u+'" alt="'+a+'" style="max-width:100%;border-radius:8px;margin:6px 0;display:block">');
  // [text](url) — 링크
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_,t,u)=>'<a href="'+u+'" target="_blank" style="color:var(--blue);text-decoration:underline">'+t+'</a>');
  // 단독 URL → 링크
  h = h.replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g, (m,p,u)=>p+'<a href="'+u+'" target="_blank" style="color:var(--blue);text-decoration:underline">'+u+'</a>');
  // **bold**
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  // 헤더 ## ###
  h = h.replace(/^###\s+(.+)$/gm, '<div style="font-size:14px;font-weight:700;margin:10px 0 4px;color:var(--ink)">$1</div>');
  h = h.replace(/^##\s+(.+)$/gm, '<div style="font-size:15px;font-weight:700;margin:12px 0 6px;color:var(--ink);border-bottom:1px solid var(--bd);padding-bottom:3px">$1</div>');
  // - 리스트
  h = h.replace(/^[\-•]\s+(.+)$/gm, '<div style="padding-left:14px;position:relative;line-height:1.6"><span style="position:absolute;left:2px">•</span>$1</div>');
  // 줄바꿈
  h = h.replace(/\n/g, '<br>');
  return h;
}
// 보고서 detail → 독립 iframe 용 self-contained HTML
function buildIsolatedDoc(md){
  const body = md2html(md);
  return '<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+
    'html,body{margin:0;padding:14px;font:14px/1.65 -apple-system,Pretendard,Segoe UI,sans-serif;color:#0f172a;background:#fff;word-break:keep-all}'+
    'img{max-width:100%;border-radius:8px;margin:6px 0;display:block}'+
    'a{color:#3b82f6}'+
    'table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}'+
    'th,td{border:1px solid #e2e8f0;padding:6px 9px;text-align:left}'+
    'th{background:#f8fafc}'+
    'b,strong{font-weight:700}'+
    '</style></head><body>'+body+
    '<script>addEventListener("load",()=>{parent.postMessage({sobiFrameHeight:document.documentElement.scrollHeight+20},"*")})<\/script>'+
    '</body></html>';
}

async function refreshReports(){
  document.getElementById('rList').innerHTML = '<div class="empty">불러오는 중…</div>';
  try {
    const r = await callApi('listIssues', {});
    reportCache = r.items || [];
    renderReports();
  } catch(e) { document.getElementById('rList').innerHTML = '<div class="empty">로드 실패: '+esc(e.message)+'</div>'; }
}
function renderReports(){
  const q = (document.getElementById('rSearch').value||'').trim().toLowerCase();
  const f = document.getElementById('rFilter').value;
  const items = reportCache.filter(it=>{
    // rMode 분리: 조사보고서 = category==='조사보고서', 이슈 = 나머지
    if (rMode==='report' && it.category !== '조사보고서') return false;
    if (rMode==='issue'  && it.category === '조사보고서') return false;
    if (f==='open' && (it.status==='해결' || it.status==='보류')) return false;
    if (f && f!=='open' && it.status !== f) return false;
    if (q && !((it.title||'').toLowerCase().includes(q) || (it.summary||'').toLowerCase().includes(q) || (it.detail||'').toLowerCase().includes(q))) return false;
    return true;
  });
  document.getElementById('rCount').textContent = items.length+'건'+(items.length<reportCache.length?' / '+reportCache.length:'');
  const el = document.getElementById('rList');
  if (!items.length) { el.innerHTML='<div class="empty">'+(reportCache.length?'검색 결과 없음':'이슈 없음')+'</div>'; return; }
  el.innerHTML = items.map(it=>{
    const upd = it.updatedAt ? new Date(it.updatedAt).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'}) : '';
    const cmtN = it.commentsCount||0;
    const cmtBadge = cmtN ? '<span class="badge" style="background:#dbeafe;color:#1e3a8a">💬 '+cmtN+'</span>' : '';
    return '<div class="issue-card" onclick="openReport(\''+esc(it.id)+'\')">'+
      '<div style="margin-bottom:5px"><span class="badge b-'+esc(it.status)+'">'+esc(it.status)+'</span><span class="badge b-cat">'+esc(it.category)+'</span>'+cmtBadge+'<span style="color:var(--mut);font-size:11px;float:right">'+upd+'</span></div>'+
      '<div style="font-weight:600;font-size:14px;line-height:1.4;margin-bottom:3px">'+esc(it.title)+'</div>'+
      (it.summary?'<div style="color:var(--mut);font-size:12px;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">'+esc(it.summary)+'</div>':'')+
    '</div>';
  }).join('');
}
function openReport(id){
  const it = reportCache.find(x=>x.id===id);
  if (!it) { toast('못 찾음'); return; }
  document.getElementById('mt').innerHTML = '📑 '+esc(it.title);
  const logHtml = (it.log||'').split('\n').filter(Boolean).reverse().map(l=>'<div style="padding:3px 0;border-bottom:1px dashed #eef2f7;font-size:12px">'+esc(l)+'</div>').join('') || '<div style="color:var(--mut);font-size:12px">로그 없음</div>';
  document.getElementById('mb').innerHTML =
    '<div style="margin-bottom:10px"><span class="badge b-'+esc(it.status)+'">'+esc(it.status)+'</span><span class="badge b-cat">'+esc(it.category)+'</span></div>'+
    '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">'+
      ['미해결','진행중','해결','보류'].map(st=>{
        const cur = st===it.status;
        return '<button class="btn" onclick="changeReport(\''+esc(it.id)+'\',\''+st+'\')" style="padding:6px 10px;font-size:12px;min-height:auto'+(cur?';background:#3b82f6;color:#fff;border-color:#3b82f6':'')+'">'+st+'</button>';
      }).join('')+
    '</div>'+
    '<div style="background:#f8fafc;border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px"><b style="font-size:11px;color:var(--mut)">요약</b><div style="margin-top:4px;white-space:pre-wrap;line-height:1.55;font-size:13px">'+esc(it.summary||'(없음)')+'</div></div>'+
    '<div style="background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px"><b style="font-size:11px;color:var(--mut)">상세 (독립 iframe)</b>'+
      '<iframe id="rDetailFrame" sandbox="allow-popups allow-popups-to-escape-sandbox" style="width:100%;border:0;margin-top:6px;background:#fff;min-height:400px" srcdoc=\''+
        (it.detail ? buildIsolatedDoc(it.detail).replace(/\'/g,'&#39;') : buildIsolatedDoc('(없음)').replace(/\'/g,'&#39;'))+
      '\'></iframe>'+
    '</div>'+
    '<div style="background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px"><b style="font-size:11px;color:var(--mut)">변경 로그</b><div style="margin-top:4px;max-height:120px;overflow:auto">'+logHtml+'</div></div>'+
    // 💬 의견 (comments) - 메모정리 시 자동 스캔 대상
    '<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px;margin-bottom:10px">'+
      '<b style="font-size:12px;color:#1e3a8a">💬 의견 ('+(it.commentsCount||0)+') — 메모정리 시 보고서에 반영</b>'+
      '<div id="rComments" style="margin-top:6px;max-height:200px;overflow:auto;display:flex;flex-direction:column;gap:5px">'+
        ((it.comments||[]).slice().reverse().map(c=>{
          const seen = c.seen ? '<span style="color:#10b981;font-size:10px">✓ 반영</span>' : '<span style="color:#f59e0b;font-size:10px">● 대기</span>';
          return '<div style="background:#fff;border:1px solid var(--bd);border-radius:7px;padding:7px 9px;font-size:13px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:3px"><span>'+esc(c.displayTime||c.ts)+'</span>'+seen+'</div><div style="white-space:pre-wrap;line-height:1.5">'+esc(c.text)+'</div></div>';
        }).join('') || '<div style="color:var(--mut);font-size:12px;text-align:center;padding:8px">아직 의견 없음 — 아래에서 첫 의견 적어보세요</div>')+
      '</div>'+
      '<div style="display:flex;gap:5px;margin-top:8px"><input id="rCmt" placeholder="의견 입력 → 메모정리 때 자동 반영" style="flex:1;padding:7px 10px;border:1px solid var(--bd);border-radius:7px;font:13px inherit"><button class="btn pri" onclick="addReportComment(\''+esc(it.id)+'\')" style="padding:7px 12px;font-size:13px;min-height:auto">💬 의견</button></div>'+
    '</div>'+
    '<div style="display:flex;gap:5px;margin-top:8px"><input id="rNote" placeholder="진행 메모(로그)" style="flex:1;padding:7px 10px;border:1px solid var(--bd);border-radius:7px;font:13px inherit"><button class="btn" onclick="addReportNote(\''+esc(it.id)+'\')" style="padding:7px 11px;font-size:13px;min-height:auto">＋ 로그</button></div>';
  document.getElementById('mOk').style.display='none';
  document.getElementById('modal').classList.add('on');
}
function closeReportModal(){ document.getElementById('mOk').style.display=''; closeModal(); }
async function changeReport(id, status){
  try { const r = await callApi('updateIssue', { id, status }); if (r && r.ok) { toast('변경: '+status); refreshReports(); setTimeout(()=>openReport(id),300); } }
  catch(e) { toast('실패: '+e.message); }
}
async function addReportNote(id){
  const note = document.getElementById('rNote').value.trim();
  if (!note) { toast('메모 입력'); return; }
  try { const r = await callApi('updateIssue', { id, note }); if (r && r.ok) { toast('로그 추가됨'); refreshReports(); setTimeout(()=>openReport(id),300); } }
  catch(e) { toast('실패: '+e.message); }
}
async function addReportComment(id){
  const text = document.getElementById('rCmt').value.trim();
  if (!text) { toast('의견 입력'); return; }
  try {
    const r = await callApi('addComment', { id, text });
    if (r && r.ok) { toast('💬 의견 등록 — 메모정리 때 보고서 자동 반영'); refreshReports(); setTimeout(()=>openReport(id),300); }
    else toast('실패: '+(r&&r.error));
  } catch(e) { toast('실패: '+e.message); }
}

// callApi 에 listIssues, updateIssue 도 GET 으로 가능하게 패치
const _origCallApi = callApi;
async function callApiV2(action, data){
  const small = !data || (!data.audioBase64 && !data.detail && !data.summary);
  const READ_GET = ['ping','listMemos','deleteMemo','getProgress','getRecentActivity','listPersonal','listIssues','getIssue'];
  if (small && READ_GET.indexOf(action) >= 0) return _origCallApi(action, data);
  return _origCallApi(action, data);
}
